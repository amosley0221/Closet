# Render Blueprint — deploys Closet as a static PWA.
# Create at https://render.com -> New -> Blueprint, then point it at this repo.
services:
  - type: web
    name: closet
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      # Don't let the service worker get stuck on a stale cached copy.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
